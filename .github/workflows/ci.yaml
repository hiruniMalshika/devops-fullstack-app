name: Build and Test Docker Image
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  packages: write
jobs:
  backend-ci:
    name: Backend Build and Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Tests(If test scripts are present )
        run: npm test --if-present

      - name: Check Backend JavaScript Syntax
        run: node --check server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: devops-app-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max   

      - name: Build and Push Backend Docker Image to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/devops-app-backend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/devops-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-ci:
    name: Frontend Build and Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Build Check
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: devops-app-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Docker Image to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/devops-app-frontend:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/devops-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Frontend Container
        run: |
          docker run -d --name test-frontend -p 3000:80 devops-app-frontend:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 2 http://localhost:3000/ >/dev/null; then
              echo "Frontend container served the application successfully."
              exit 0
            fi
            status=$(docker inspect --format='{{.State.Status}}' test-frontend 2>/dev/null || echo missing)
            if [ "$status" != "running" ]; then
              echo "Frontend container stopped before becoming healthy (status: $status)."
              exit 1
            fi
            sleep 2
          done
          echo "Frontend did not respond within 30 seconds."
          exit 1

      - name: Show Frontend Container Diagnostics
        if: failure()
        run: |
          docker logs test-frontend || true
          docker inspect --format='State: {{json .State}}' test-frontend || true

      - name: Remove Frontend Test Container
        if: always()
        run: docker rm -f test-frontend 2>/dev/null || true

  compose-integration:
    name: Compose Integration Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Compose Stack
        run: docker compose up -d --build

      - name: Verify API and PostgreSQL Integration
        run: |
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 \
            http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/api/items
          response=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"name":"GitHub Actions integration check"}' \
            http://localhost:3000/api/items)
          echo "$response" | grep -F '"name":"GitHub Actions integration check"'
          curl --fail --silent --show-error http://localhost:3000/api/items \
            | grep -F '"name":"GitHub Actions integration check"'

      - name: Stop Compose Stack
        if: always()
        run: docker compose down -v
